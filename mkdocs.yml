site_name: AIR Twizy Hardware
site_description: Documentation for the AIR-UFG Twizy hardware stack — camera, LiDAR and vehicle interface
site_url: https://air-ufg.github.io/air_twizy_hardware
repo_url: https://github.com/AIR-UFG/air_twizy_hardware
repo_name: AIR-UFG/air_twizy_hardware
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Networking:
    - Overview: networking/index.md
    - NetBird VPN: networking/netbird.md
    - Discovery Server: networking/discovery-server.md
  - Teleoperation:
    - Overview: teleoperation/index.md
    - Xbox Controller: teleoperation/xbox-controller.md
  - Camera (Lucid Vision):
    - Overview: camera/index.md
    - Node Parameters: camera/parameters.md
    - Multi-machine Streaming: camera/streaming.md
    - Recording: camera/recording.md
  - LiDAR (Ouster):
    - Overview: lidar/index.md
  - Vehicle:
    - Overview: vehicle/index.md
    - Vehicle Interface: vehicle/interface.md
  - Hardware:
    - Vehicle: hardware/index.md
    - Sensors: hardware/sensors.md
  - Configuration: configuration.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AIR-UFG
