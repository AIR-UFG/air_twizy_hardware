services:
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: discovery_server
    network_mode: "host" # Mandatory to see Netbird IP
    command: >
      -i 0
    restart: unless-stopped

  camera:
    build:
      context: ./workspace/camera-lucid
      dockerfile: Dockerfile
    depends_on:
      - discovery-server
    image: air-twizy-camera:latest
    container_name: air_twizy_camera
    volumes:
      - ./workspace/camera-lucid/ros2_ws:/arena_camera_ros2/ros2_ws
      - ./workspace/camera-lucid/scripts:/arena_camera_ros2/scripts
      - ./workspace/camera-lucid/launch:/arena_camera_ros2/launch
      - ./workspace/camera-lucid/config:/arena_camera_ros2/config
      - ./workspace/camera-lucid/bags:/arena_camera_ros2/bags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${CAMERA_RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Camera serials (comma-separated). Each serial becomes
      # camera_1, camera_2, ... publishing on /camera_N/image_raw.
      CAMERA_SERIALS: ${CAMERA_SERIALS:-}
      # Optional: detailed camera YAML path (overrides CAMERA_SERIALS).
      CAMERA_CONFIG_FILE: ${CAMERA_CONFIG_FILE:-}
      CAMERA_SERIAL: ${CAMERA_SERIAL:-}
      CAMERA_TOPIC: ${CAMERA_TOPIC:-/camera/image_raw}
    network_mode: host
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    # multi_camera.launch.py is mounted at /arena_camera_ros2/launch (./launch volume).
    # Cameras come from CAMERA_SERIALS (.env). For a detailed YAML, set
    # CAMERA_CONFIG_FILE in .env (launch reads env; takes precedence).
    command:
      - ros2
      - launch
      - /arena_camera_ros2/launch/multi_camera.launch.py

  ouster_lidar:
    build:
      context: ./workspace/ouster-ros
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
        RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    image: ouster-ros:humble
    depends_on:
      - discovery-server
    container_name: ouster_lidar
    environment:
      # DDS — same value on host when using rviz2/topics outside the container
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # RMW (must match the built image)
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # X11 / Wayland (RViz in container)
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=${QT_X11_NO_MITSHM:-1}
      - ROS_DISCOVERY_SERVER=${ROS_DISCOVERY_SERVER:-twizy:11811}
      - ROS_SUPER_CLIENT=${ROS_SUPER_CLIENT:-true}
    volumes:
      # X11 socket — container user is UID 1000 (build); match host user or use xhost
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Host-editable entrypoint (sources ROS + workspace overlay)
      - ./entrypoint_ouster.sh:/var/lib/build/entrypoint.sh:ro
      # Do not mount an anonymous volume on ~/.ros: owned by root and user `build` (1000) cannot write .ros/log.
      # ROS logs/metadata stay in the container writable layer (fine for normal use).
      # To persist on host: mkdir -p ./ouster_ros_home && sudo chown -R 1000:1000 ./ouster_ros_home
      # and uncomment:
      # - ./ouster_ros_home:/var/lib/build/.ros
      # Optional: bags/recordings on host (uncomment and create the folder)
      # - ./bags:/var/lib/build/bags
    # Required for LiDAR UDP and sensor HTTP API (same network view as host)
    network_mode: host
    privileged: true
    # Improves DDS / shared memory between ROS 2 processes
    ipc: host
    # Larger /dev/shm — helps large publishers (point cloud)
    shm_size: "1gb"
    stdin_open: true
    tty: true
    env_file:
      - .env
    # Host-editable entrypoint sources ROS 2 + workspace overlay before `command` below.
    entrypoint: ["bash", "/var/lib/build/entrypoint.sh"]
    command:
      - ros2
      - launch
      - ouster_ros
      - sensor.launch.xml
      # Set SENSOR_HOSTNAME in `.env` (see env.exemple) or export in the shell
      - sensor_hostname:=${SENSOR_HOSTNAME:-192.168.1.200}
      - viz:=${VIZ:-false}
    restart: unless-stopped

  car:
    build:
      context: ./workspace/twizy
      dockerfile: docker/Dockerfile
    image: air-twizy-car-image:v1
    depends_on:
      - discovery-server
    container_name: air_car_container
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      # X11 / GUI (RViz, Gazebo)
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
      XAUTHORITY: ${XAUTHORITY:-/tmp/.docker.xauth}
      # Twizy stack flags (run.sh / launches)
      GPU: ${TWIZY_GPU:-false}
      LIDAR: ${TWIZY_LIDAR:-false}
      INTERFACE: ${TWIZY_INTERFACE:-true}
      CAN_PORT: ${TWIZY_CAN_PORT:-can0}
      RVIZ: ${TWIZY_RVIZ:-false}
      NVIDIA_RUNTIME: ${NVIDIA_RUNTIME:-runc}
      # ROS 2 / Fast DDS (discovery server on the same machine)
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_DISCOVERY_SERVER: ${ROS_DISCOVERY_SERVER:-twizy:11811}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ${TWIZY_HOST_FOLDER_PATH:-./workspace/twizy/ros_packages}:${CONTAINER_FOLDER_PATH:-/root/ros2_ws/src/}:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:/tmp/.docker.xauth:rw
      - ${TWIZY_SHARED_FOLDER:-./workspace/twizy/shared_folder}:/root/shared_folder:rw
      - ${TWIZY_UTILS_PATH:-./workspace/twizy/utils}:/root/utils:rw
      # Host-editable entrypoint (sources ROS + workspace overlay)
      - ./entrypoint_twizy.sh:/root/entrypoint_twizy.sh:ro
    runtime: ${NVIDIA_RUNTIME:-runc}
    entrypoint: ["bash", "/root/entrypoint_twizy.sh"]
    restart: unless-stopped
    command:
      - ros2
      - launch
      - sd_vehicle_interface
      - sd_vehicle_interface.launch.xml
      - sd_vehicle:=twizy
      - sd_gps_imu:=peak
      - sd_speed_source:=vehicle_can_speed

  # Dashboard web de teleoperação — roda no PC do OPERADOR.
  # Cliente do discovery server do carro (twizy:11811) via Netbird.
  # Subir só este serviço:  docker compose up dashboard
  # Acesso:                 http://localhost:5000
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: air-twizy-dashboard:latest
    container_name: air_twizy_dashboard
    depends_on:
      - discovery-server
    network_mode: host # Mandatory to route traffic via Netbird interface
    environment:
      # Aponta para o discovery server do carro (IP Netbird "twizy")
      ROS_DISCOVERY_SERVER: ${ROS_DISCOVERY_SERVER:-twizy:11811}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_SUPER_CLIENT: ${ROS_SUPER_CLIENT:-true}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      # dashboard.py editável sem rebuild
      - ./dashboard.py:/root/dashboard.py:ro
    # Tópicos comprimidos publicados pelos relays do carro (ver pasta relays/).
    # Confira os nomes reais com: ros2 topic list | grep camera
    command:
      - python3
      - /root/dashboard.py
      - --cam1
      - /camera/top_left/image_raw/compressed
      - --cam2
      - /camera/top_front/image_raw/compressed
      - --cam3
      - /camera/top_right/image_raw/compressed
    restart: unless-stopped
